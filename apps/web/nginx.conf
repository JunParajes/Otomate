# nginx's bundled mime.types has no entry for .webmanifest (checked on
# nginx 1.31.4), so without this the manifest is served as
# application/octet-stream and Chrome refuses it as an unsupported MIME type.
types {
    application/manifest+json  webmanifest;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Must never be cached ─────────────────────────────────────────────
    # Exact-match locations take priority over the regex blocks below.
    #
    # sw.js is the important one: it ends in .js, so the old blanket
    # "expires 1y; immutable" rule pinned it for a year. A service worker that
    # can never update leaves every installed client frozen on whatever build
    # it first saw, with no way back short of clearing site data.
    location = /sw.js                 { add_header Cache-Control "no-cache"; expires off; }
    location = /registerSW.js         { add_header Cache-Control "no-cache"; expires off; }
    location = /manifest.webmanifest  { add_header Cache-Control "no-cache"; expires off; }

    # index.html names the fingerprinted asset files. Cache it and the browser
    # keeps requesting a build that no longer exists.
    location = /index.html            { add_header Cache-Control "no-cache"; expires off; }

    # ── Build output ─────────────────────────────────────────────────────
    # Vite fingerprints everything in /assets/, so the filename changes whenever
    # the contents do. Only these are safe to call immutable. ^~ stops the regex
    # block below from stealing the match.
    # One Cache-Control header, not two: nginx's `expires` emits its own, and a
    # separate add_header appends a second that proxies then have to reconcile.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Static files from public/ ────────────────────────────────────────
    # Icons keep the same filenames across builds, so they get a short cache
    # rather than an immutable one — otherwise a redesigned icon would take a
    # year to reach anyone who had already loaded the app.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webmanifest|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # React Router: serve index.html for all routes (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml text/xml application/xml;
}
