name: Build, Push & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/junparajes/otomate-api
  WEB_IMAGE: ghcr.io/junparajes/otomate-web

jobs:
  # Gate. Until this existed, every deploy was verified only by whoever
  # remembered to run `tsc --noEmit` locally first, and by driving the running
  # app by hand.
  #
  # The two build steps below are NOT optional and NOT cosmetic — measured on a
  # clean checkout, `pnpm -r exec tsc --noEmit` on its own fails with 40+ errors
  # that say nothing about the code:
  #   - `packages/shared/dist` is gitignored, and api/web resolve @otomate/shared
  #     to its dist, so every import of it is "Cannot find module"
  #   - @prisma/client is generated, not committed, so Branch/Prisma/Role/User
  #     "have no exported member"
  # Skipping either turns this gate into a job that always fails, which gets
  # disabled within a week and protects nothing.
  verify:
    name: Typecheck & test
    runs-on: ubuntu-latest

    # The API tests run against a real Postgres, not a mock. What they check —
    # which fields a permission returns, whether a guard refuses a delete,
    # whether a DATE survives a round trip — are properties of the database and
    # the query, and a mock would answer all three confidently and wrongly.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: otomate
          POSTGRES_PASSWORD: test
          POSTGRES_DB: otomate_test
        ports: ['5432:5432']
        # Without this the first migration can race the server's startup.
        options: >-
          --health-cmd "pg_isready -U otomate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://otomate:test@localhost:5432/otomate_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-32chars
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared (api and web typecheck against its dist)
        run: pnpm --filter shared build

      - name: Generate Prisma client (its types are generated, not committed)
        run: pnpm --filter api exec prisma generate

      - name: Typecheck every package
        run: pnpm -r exec tsc --noEmit

      # Runs after the typecheck so a type error reports as a type error rather
      # than as a wall of failing tests.
      #
      # The API suite applies migrations to the service container itself and
      # truncates between tests, so it needs no separate setup step.
      - name: Test
        run: pnpm -r test

  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    # Nothing reaches GHCR, and therefore nothing reaches production, unless the
    # code typechecks and the tests pass.
    needs: verify
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:latest,${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:latest,${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # scripts/ must ship too: docker-compose.prod.yml bind-mounts
          # scripts/cloudflare-ddns.sh, and a missing bind source makes Docker
          # silently create a DIRECTORY there instead of failing.
          source: "docker-compose.prod.yml,scripts/*"
          target: "~/otomate"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/otomate

            # Pull latest images
            docker compose -f docker-compose.prod.yml pull

            # Run migrations before restarting api.
            # If this fails with P3005 ("schema is not empty"), the server DB
            # predates migrations — run scripts/baseline-prod-db.sh once, then redeploy.
            docker compose -f docker-compose.prod.yml run --rm api \
              sh -c "npx prisma migrate deploy"

            # Sync the permission catalog. Migrations create TABLES; permissions
            # are ROWS, seeded from packages/shared. Without this a new
            # permission never reaches production — the feature ships, the
            # permission cannot be granted to any role, and only super_admin
            # (which bypasses the check) can use it. That happened with the hr:*
            # permissions on 2026-08-30 and had to be fixed by hand.
            #
            # Safe on every deploy: permissions are upserted, the admin account
            # is left alone when it already exists ("Password unchanged"), and
            # the branch upsert is a no-op. It deletes only permissions that no
            # longer exist in shared, which is the intended mirror behaviour.
            docker compose -f docker-compose.prod.yml run --rm api \
              sh -c "npx prisma db seed"

            # Infrastructure first. These change rarely and are recreated the
            # normal way; api and web are handled below. Listing them explicitly
            # is safe — --remove-orphans only removes containers whose service is
            # gone from the compose file, not services omitted from this list.
            # A new infra service added later must be added here too.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans \
              postgres traefik cloudflared ddns

            # Zero-downtime for the two services that serve traffic. Starts the
            # replacement alongside the running container, waits for Docker to
            # report it healthy (Traefik sends it no traffic until then), and
            # only then removes the old one. If the replacement never turns
            # healthy the rollout aborts and the previous version keeps serving.
            chmod +x scripts/rollout.sh
            ./scripts/rollout.sh api web

            # Clean up unused images
            docker image prune -f

            echo "Deploy complete at $(date)"
