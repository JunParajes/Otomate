name: Build, Push & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/junparajes/otomate-api
  WEB_IMAGE: ghcr.io/junparajes/otomate-web

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:latest,${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:latest,${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push

    # Read once here so the step below can test it. Secrets cannot be used
    # directly in a step-level `if`, but an env var carrying one can.
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Joins the runner to the private network so it can reach the server
      # without any port being open to the internet.
      #
      # Conditional on purpose: until the Tailscale secrets exist this is
      # skipped and the deploy still goes over the public address, so setting
      # this up cannot break deploys halfway through. Once SERVER_HOST points at
      # the tailnet name, this step is what makes it reachable.
      - name: Join Tailscale
        if: env.TS_OAUTH_CLIENT_ID != ''
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          # The runner is short-lived; tagging it keeps CI machines from
          # accumulating in the tailnet as stale devices.
          tags: tag:ci

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # scripts/ must ship too: docker-compose.prod.yml bind-mounts
          # scripts/cloudflare-ddns.sh, and a missing bind source makes Docker
          # silently create a DIRECTORY there instead of failing.
          source: "docker-compose.prod.yml,scripts/*"
          target: "~/otomate"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/otomate

            # Pull latest images
            docker compose -f docker-compose.prod.yml pull

            # Run migrations before restarting api.
            # If this fails with P3005 ("schema is not empty"), the server DB
            # predates migrations — run scripts/baseline-prod-db.sh once, then redeploy.
            docker compose -f docker-compose.prod.yml run --rm api \
              sh -c "npx prisma migrate deploy"

            # Infrastructure first. These change rarely and are recreated the
            # normal way; api and web are handled below. Listing them explicitly
            # is safe — --remove-orphans only removes containers whose service is
            # gone from the compose file, not services omitted from this list.
            # A new infra service added later must be added here too.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans \
              postgres traefik cloudflared ddns

            # Zero-downtime for the two services that serve traffic. Starts the
            # replacement alongside the running container, waits for Docker to
            # report it healthy (Traefik sends it no traffic until then), and
            # only then removes the old one. If the replacement never turns
            # healthy the rollout aborts and the previous version keeps serving.
            chmod +x scripts/rollout.sh
            ./scripts/rollout.sh api web

            # Clean up unused images
            docker image prune -f

            echo "Deploy complete at $(date)"
