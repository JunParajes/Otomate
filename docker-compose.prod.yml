name: otomate

services:
  traefik:
    image: traefik:v3
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - otomate-net
    restart: unless-stopped

  # Outbound-only connection to Cloudflare. Because the server dials OUT, a
  # changing home IP is irrelevant and no router port-forwarding is needed —
  # which is why this suits a residential line with a dynamic address.
  #
  # Routing (which hostname reaches which service) is configured in the
  # Cloudflare dashboard, not here. Point it at http://traefik:80.
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    command: tunnel --no-autoupdate run
    environment:
      # Deliberately NOT ${TUNNEL_TOKEN:?...}: a hard failure here makes compose
      # refuse to parse, which would take the whole stack down over a missing
      # tunnel token. The app must keep serving the encoder on the LAN even if
      # the tunnel cannot start. Without a token this container restart-loops,
      # which is visible in `docker compose ps` and harms nothing else.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks:
      - otomate-net
    depends_on:
      - traefik
    restart: unless-stopped

  # Keeps server.otomate.uk pointing at this machine's current public IP, so the
  # GitHub Actions deploy can use a hostname instead of an address that goes
  # stale after every blackout. The APP does not need this — the tunnel is
  # outbound — but SSH cannot go through the tunnel without extra client tooling.
  ddns:
    image: alpine:3.22
    command: >
      sh -c "apk add --no-cache --quiet curl jq >/dev/null &&
             exec sh /opt/cloudflare-ddns.sh"
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ZONE_NAME: ${CF_ZONE_NAME:-otomate.uk}
      CF_RECORD_NAME: ${CF_RECORD_NAME:-server.otomate.uk}
      CF_INTERVAL: ${CF_INTERVAL:-300}
    volumes:
      - ./scripts/cloudflare-ddns.sh:/opt/cloudflare-ddns.sh:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - otomate-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/junparajes/otomate-api:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      API_PORT: 3001
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
    volumes:
      # Product images live here. NOT covered by pg_dump — back this up separately.
      - product-images:/app/uploads
    networks:
      - otomate-net
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/uploads`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=3001"
    restart: unless-stopped

  web:
    image: ghcr.io/junparajes/otomate-web:latest
    networks:
      - otomate-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    restart: unless-stopped

networks:
  otomate-net:
    driver: bridge

volumes:
  pgdata:
  product-images:
